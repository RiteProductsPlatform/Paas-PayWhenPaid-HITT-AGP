<oj-sp-welcome-page id="oj-sp-wp1" page-title="Discrepancy Workbench"
  illustration-background="[[ $variables.illustrationBackground ]]"
  illustration-foreground="[[ $variables.illustrationForeground ]]" background-color="dark-pebble">

  <div class="oj-panel " style="margin-top:-45px">
    <!-- <div class="oj-flex-item"> -->
      <oj-form-layout columns="5" max-columns="5" label-edge="top">
        <oj-select-single label-hint="AP Invoice" item-text="ap_invoice"
          on-value-item-changed="[[$listeners.selectValueItem]]" data="[[$variables.getPWPAPInvoiceNumbersListSDP]]"
          value="{{ $variables.headers.apInvoice }}"></oj-select-single>
        <oj-select-single label-hint="Supplier" item-text="supplier_name"
          on-value-item-changed="[[$listeners.selectValueItem2]]" data="[[$variables.getPWPSupplierDetailsListSDP]]"
          value="{{ $variables.headers.supplier }}"></oj-select-single>
        <oj-select-single label-hint="Project" item-text="project_number"
          on-value-item-changed="[[$listeners.selectValueItem3]]" data="[[$variables.getPWPProjectNumbersListSDP]]"
          value="{{ $variables.headers.project }}"></oj-select-single>
      </oj-form-layout>
      
              <div  class="oj-helper-text-align-end">
                <oj-button label="Search" chroming="callToAction" class="oj-button-sm" 
                  on-oj-action="[[$listeners.buttonAction4]]" style="margin-left:2px">
                  <span class="oj-ux-ico-search" slot="startIcon"></span>
                </oj-button>
                <oj-button  label="Reset" chroming="callToAction" on-oj-action="[[$listeners.buttonAction2]]"
                  class="oj-button-sm" style="margin-left:2px">
                  <span class="oj-ux-ico-refresh" slot="startIcon"></span>
                </oj-button>
              
                <oj-button  label="Release" chroming="danger" on-oj-action="[[$listeners.buttonAction3]]"
                  class="oj-button-sm" style="margin-left:2px">
                </oj-button>
                 <oj-switch label-hint="Enable Trace" value="[[$application.variables.enableTrace]]" style="margin-top:-12px"
                on-value-changed="[[$listeners.switchValue]]"
          ></oj-switch>   
            <b>   <oj-bind-text
                      value='[[ $application.variables.traceIdDisplay ? "Trace ID:" + $application.variables.traceIdDisplay : "Trace ID" ]]'></oj-bind-text></b>
            
          <!-- </oj-toolbar> -->

  <div>
      <oj-table scroll-policy="loadMoreOnScroll" columns-default.resizable="enabled" selection-mode.row="multiple"
        style="width:94vw;height:60vh" display="grid" data="[[ $variables.disp_searchADP ]]"
        columns='[{"headerText":"Project Number","field":"project_number"},{"headerText":"PO Number","field":"po_number"},{"headerText":"PO Receipt Number","field":"po_receipt_number"},{"headerText":"Invoice Number","field":"invoice_number"},{"headerText":"Invoice Amount","field":"invoice_amount"},{"headerText":"Supplier Name","field":"vendor_name"},{"headerText":"Hold Status","field":"invoice_hold_applied"}]'
        on-selected-changed="[[$listeners.tableSelected2]]" selected.row="{{ $variables.selectedrowDetails }}">

        <!-- <template slot="date">
          <oj-bind-text value="[[ $functions.formatDate($current.data) ]]"></oj-bind-text>
        </template> -->
      </oj-table>
  </div>
  

   <oj-dialog dialog-title="" id="loadingDialog" class="myloader" style="width: 350px">
      <div slot="body">
        <div class="oj-flex-item">
          <span style="font-size:20px;color:#006AA2;font-weight:600;margin-top:-2vh">Loading .....</span>
          <br />
          <oj-progress-bar value="-1" class="oj-sm-margin-3x-top"></oj-progress-bar>
        </div>
      </div>
    </oj-dialog>
  </div>
</oj-sp-welcome-page>
