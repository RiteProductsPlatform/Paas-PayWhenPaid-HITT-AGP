<oj-sp-welcome-page id="oj-sp-wp1" page-title="PWP Criteria" primary-action.display="off" primary-action.label="Done"
  illustration-background="[[ $variables.illustrationBackground ]]"
  illustration-foreground="[[ $variables.illustrationForeground ]]" background-color="dark-pebble">
  <div class="oj-panel" style="margin-top:-45px">

    <!-- <div class="oj-flex-item oj-sm-flex-initial oj-sm-margin-2x-end"> -->
      <oj-form-layout columns="5" label-edge="top" max-columns="5">
        <oj-select-single label-hint="Project Name" item-text="project_name" style="width:22vw"
          on-value-item-changed="[[$listeners.selectValueItem]]" value="{{ $variables.searchProjectName }}"
          data="[[$variables.pWPProjectLOVCriteriaSearchListSDP]]" Show Busy State=""></oj-select-single>

        <oj-select-single label-hint="Enable Criteria" style="width:22vw" data="[[ $application.variables.YesNoADP ]]"
          item-text="LookupCode" value="{{ $variables.headers_enable_Criteria }}"></oj-select-single>

      </oj-form-layout>
      <div class="oj-helper-text-align-right">

      <oj-button label="Search" chroming="callToAction" class="oj-button-sm"
        on-oj-action="[[$listeners.buttonAction6]]">
        <span class="oj-ux-ico-search" slot="startIcon"></span>
      </oj-button>
      <oj-button chroming="callToAction" class="oj-button-sm" label="Reset" on-oj-action="[[$listeners.buttonAction5]]">
        <span class="oj-ux-ico-refresh" slot="startIcon"></span>
      </oj-button>
      <oj-button chroming="callToAction" class="oj-button-sm" label="Create Criteria"
        on-oj-action="[[$listeners.buttonAction2]]">
      </oj-button>

      <!-- added trace id logic for debugging mechaism -->
      <oj-switch label-hint="Enable Trace" value="[[$application.variables.enableTrace]]" style="margin-top:-12px"
        on-value-changed="[[$listeners.switchValue3]]"></oj-switch>
      <!-- <oj-label>Trace ID:</oj-label> -->
      <b>
      <oj-bind-text
        value='[[ $application.variables.traceIdDisplay ? "Trace ID:" + $application.variables.traceIdDisplay : "Trace ID" ]]'></oj-bind-text>
      </b>
    <!-- </div> -->
    </div>
    

    <div>

      <oj-table scroll-policy="loadMoreOnScroll" id="criteria" columns-default.resizable="enabled"
        columns='[{"headerText":"Action","field":"","sortable":"disabled","template":"editicon","width":70},{"headerText":"Criteria Name","field":"criteria_name"},{"headerText":"Project Name","field":"project_name"},{"headerText":"Top Task Name","field":"top_task_name"},{"headerText":"Task Name","field":"task_name"},{"headerText":"Expenditure Category","field":"expenditure_category"},{"headerText":"Expenditure Type","field":"expenditure_type"},{"headerText":"Supplier Name","field":"supplier_name"},{"headerText":"Start Date","field":"start_dt","template":"date"},{"headerText":"End Date","field":"end_dt","template":"date"},{"headerText":"Lag Days","field":"lag_days"},{"headerText":"Enabled Criteria","field":"enabled_flag"}]'
        display="grid" selection-mode.column="single" selection-mode.row="none" style="width:94vw;height:60vh"
        data="[[ $variables.tableData ]]">
        <template slot="checkTemplate" data-oj-as="cell">
          <oj-switch value="[[cell.data === 'true' ? true : false]]"
            style="--oj-switch-thumb-diameter: 24px; --oj-switch-track-height: 19px; --oj-switch-track-width: 38px; --color: Green; padding-center:1vw;"
            class="o oj-switch" on-value-changed="[[$listeners.switchValue2]]">
          </oj-switch>

        </template>
        <template slot="editicon">
          <oj-button chroming="borderless" class="oj-button-sm">
            <span class="oj-ux-ico-edit" style="font-weight:bold;font-size:22px;cursor:pointer"
            on-click="[[$listeners.iconClick]]" slot="startIcon"></span>
          </oj-button>
        </template>

        <template slot="date">
          <oj-bind-text value="[[ $functions.formatDate($current.data) ]]"></oj-bind-text>
        </template>
      </oj-table>
    </div>

  </div>
