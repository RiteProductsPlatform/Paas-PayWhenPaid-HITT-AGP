<div id="pageContent" class="oj-web-applayout-page vb-web-applayout-page">




  <header role="banner" class="oj-web-applayout-header vb-web-applayout-header"
    style="background-color:#000000; background-image:none; width:100%; box-shadow:0 2px 6px rgba(0,0,0,0.4); border-bottom:none; position:relative; z-index:100;">
    <div class="oj-flex-bar oj-sm-align-items-center"
      style="height:52px; padding-left:16px; padding-right:8px;">
      <!-- Application title (left) -->
      <div class="oj-flex-bar-start oj-sm-align-items-center">
        <span class="pwp-header-title" style="font-size:18px; font-weight:700; color:#ffffff !important; letter-spacing:0.5px; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,0.3);">Pay When Paid</span>
      </div>
      <!-- Menu icon (right) -->
      <div class="oj-flex-bar-end oj-sm-align-items-center">
        <oj-button display="icons" chroming="borderless" on-oj-action="[[$listeners.buttonAction]]"
          class="oj-button-sm">
          <span slot="startIcon" class="oj-ux-ico-menu" style="color:#ffffff; font-size:20px;"></span>
        </oj-button>
      </div>
    </div>
  </header>
  
<oj-messages id="vbDefaultNotifier" display-options.category="none"
  position='{"collision":"none","at":{"horizontal":"center","vertical":"top"}}'
  messages="{{$page.variables.messagesADP}}" on-oj-close="[[$listeners.messagesBannerSpClose]]"></oj-messages>  


  <!-- <oj-sp-messages-banner data="[[ $variables.messagesBannerADP ]]" class="oj-flex-item"
    on-sp-close="[[$listeners.messagesBannerSpClose]]"></oj-sp-messages-banner> -->

  <oj-sp-messages-toast primary-text="[[ $variables.messageToast ]]" id="messageToast"></oj-sp-messages-toast>

  <oj-drawer-popup edge="end" opened="{{ $application.variables.navDrawer }}" class="oj-bg-neutral-170 oj-color-invert">

    <div class="oj-flex oj-flex-item oj-sm-flex-initials oj-sm-justify-content-flex-end">
      <oj-button display="icons" chroming="borderless" on-oj-action="[[$listeners.buttonAction]]">
        <span slot="startIcon" class="oj-ux-ico-close-square-s"></span>
      </oj-button>
    </div>
    <div class="oj-flex-item">
      <oj-conveyor-belt id="navConveyorBelt">
        <oj-navigation-list edge="start" data="[[ $application.variables.navigationADP ]]"
          selection="{{ $variables.currentFlow }}" on-selection-changed="[[$listeners.navigationListSelection]]">
          <template slot="itemTemplate">
            <li>
              <a href="#">
                <span :class="[['oj-navigationlist-item-icon oj-typography-body-md oj-sm-padding-3x-horizontal ' + $current.data.iconClass]]"></span>
                <oj-bind-text value="[[$current.data.name]]"></oj-bind-text>
              </a>
            </li>
          </template>
        </oj-navigation-list>
      </oj-conveyor-belt>
    </div>
  </oj-drawer-popup>



  <div class="oj-flex" style="flex:1; min-height:0; overflow:hidden;">
    <oj-vb-content id="vbRouterContent" class="oj-flex-item" config="[[vbRouterFlow]]">

    </oj-vb-content>
  </div>


</div>
