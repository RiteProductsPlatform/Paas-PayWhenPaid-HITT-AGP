<oj-sp-welcome-page id="oj-sp-wp1" illustration-background="[[ $application.variables.illustrationBackground ]]"
  illustration-foreground="[[ $application.variables.illustrationForeground ]]" display-options.responsive-padding="on"
  page-title="Dashboard" background-color="dark-pebble">
  <div class="oj-flex dashboard-container">
    <div class="oj-flex-item card card-blue">
      <div class="card-content">
        <div class="card-info"> <span class="card-number">24</span>
          <span class="card-label">Total Criterias Created</span> </div>
        <div class="card-icon icon-blue"> <i class="oj-ux-ico-list"></i> </div>
      </div>
    </div>
    <div class="oj-flex-item card card-orange">
      <div class="card-content">
        <div class="card-info"> <span class="card-number">75</span> <span class="card-label">Total Hold Applied</span>
        </div>
        <div class="card-icon icon-orange"> <i class="oj-ux-ico-pause"></i> </div>
      </div>
    </div>
    <div class="oj-flex-item card card-green">
      <div class="card-content">
        <div class="card-info"> <span class="card-number">16</span>
          <span class="card-label">Total Release Applied</span> </div>
        <div class="card-icon icon-green"> <i class="oj-ux-ico-check-circle"></i> </div>
      </div>
    </div>
    <div class="oj-flex-item card card-red">
      <div class="card-content">
        <div class="card-info"> <span class="card-number">2</span>
          <span class="card-label">Total Unmatched Invoices</span> </div>
        <div class="card-icon icon-red"> <i class="oj-ux-ico-warning"></i> </div>
      </div>
    </div>
  </div>
</oj-sp-welcome-page>
