<oj-sp-smart-search-page page-title="Analytics"
  display-mode="mixed"
  style="--oj-sp-theme-page-container-bkgd:#5c1a2a;">
  <oj-sp-smart-search id="oj_ssp1"
    slot="search"
    filter-criterion="{{ $variables.filterCriterion }}"
    on-filter-criterion-changed="[[$listeners.filterCriterionChanged]]"
    search-config="[[ $variables.searchConfiguration.provider ]]"
    search-context="[[ $variables.searchContext ]]"
    suggestion-filters='["Project","Supplier"]'
    placeholder="Search Analytics">
  </oj-sp-smart-search>
  <oj-sp-collection-container display-options.add="off" display-options.delete="off">
  <div class="oj-panel" style="height:850px; overflow-y:auto; overflow-x:hidden;">
 <div class="oj-flex">
    <!-- <div class="oj-flex-item oj-sm-0.2 "></div> -->
    <div class="oj-flex-item oj-sm-5 oj-panel">
      <h4>Metrics</h4>
      <oj-chart type="bar" class="oj-sm-flex-initial" style=" padding:0 5px; height:35vh;"
        style-defaults.three-d-effect="on" data="[[ $variables.chartADP ]]" animation-on-data-change="auto"
        animation-on-display="auto" style-defaults.bar-gap-ratio="0.01" legend.title="Metrics" hover-behavior="dim">
        <template slot="itemTemplate" data-oj-as="item">
          <oj-chart-item value="[[ item.data.value ]]" group-id="[[ [item.data.group] ]]"
            series-id="[[ item.data.series ]]"
            short-desc="[[ 'Metric: ' + item.data.group + '\nValue: ' + item.data.value + '\nNotes: ' + item.data.notes ]]">
          </oj-chart-item>
        </template>
        <template slot="seriesTemplate" data-oj-as="series">
          <oj-chart-series color="[[
       series.id === 'Total Subcontractor invoices awaiting owner payment' ? '#F44336' :   /* Red */
       series.id === 'Owner payments received this month' ? '#2196F3' :   /* Blue */
       series.id === 'Subcontractor payments released this month (PWP)' ? '#4CAF50' :   /* Green */
       series.id === 'Current cash tied up in PWP hold' ? '#FF9800' :   /* Orange */
       null
     ]]" border-color="#000">
          </oj-chart-series>
        </template>
      </oj-chart>
    </div>

    <div class="oj-flex-item oj-sm-5 oj-panel" style="margin-left:10px">
      <h4>Aging</h4>
      <oj-chart type="bar" class="oj-sm-flex-initial" style="padding:0 5px;height:35vh;" animation-on-display="auto"
        style-defaults.three-d-effect="on" data="[[ $variables.agingChartADP ]]" animation-on-data-change="auto"
        legend.title="Aging" style-defaults.bar-gap-ratio="0.01" hover-behavior="dim">
        <template slot="itemTemplate" data-oj-as="item">
          <oj-chart-item value="[[ item.data.value ]]" group-id="[[ [item.data.group] ]]"
            series-id="[[ item.data.series ]]"
            short-desc="[[ 'Aging: ' + item.data.group + '\nAmount Held of Invoices: ' + item.data.value  ]]">
          </oj-chart-item>

        </template>
        <template slot="seriesTemplate" data-oj-as="series">
          <oj-chart-series color="[[
  series.id === '0-15days' ? '#FF5733' :
  series.id === '16-30days' ? '#2196F3' :
  series.id === '31-60days' ? '#4CAF50' :
  series.id === '60+days' ? '#F44336' : null
]]" border-color="#000">
          </oj-chart-series>
        </template>
      </oj-chart>
    </div>
  </div>

    <div class="oj-flex-item" >

      <oj-form-layout columns="4" max-columns="4" label-edge="top">

        <oj-select-single label-hint="Project" value="{{ $variables.analyticsHeaders.projectName }}"
          data="[[$variables.getIcApiIntegrationV2FlowsRestProjectPAYWHENPAIDPWPPROJECTSYNC1GetprojectsListSDP3]]"
          item-text="name"></oj-select-single>
        <oj-select-single label-hint="Supplier" value="{{ $variables.analyticsHeaders.supplierName }}"
          data="[[$variables.getPWPSUPPLIERLOVListSDP]]" item-text="vendor_name"></oj-select-single>

        <div style="margin-top:20px">
          <oj-button label="Search" chroming="callToAction" class="oj-button-sm"
            on-oj-action="[[$listeners.buttonAction]]">
            <span class="oj-ux-ico-search" slot="startIcon"></span>
          </oj-button>
          <oj-button label="Reset" chroming="callToAction" class="oj-button-sm"
            on-oj-action="[[$listeners.buttonAction2]]">
            <span class="oj-ux-ico-refresh" slot="startIcon"></span>
          </oj-button>
        </div>
    </div>
    </oj-form-layout>

  <div>
    <oj-table scroll-policy="loadMoreOnScroll" style="width:92vw;height:500px"
      columns='[{"headerText":"Project Name","field":"project_name"},{"headerText":"Supplier Name","field":"vendor_name"},{"headerText":"AR Invoices Amount","field":"ar_invoices_amount","width":"150px"},{"headerText":"AP Invoices Approved","field":"ap_invoices_approved"},{"headerText":"AP Invoices Paid","field":"ap_invoices_paid"},{"headerText":"Pending AP Invoices Amount","field":"pending_ap_invoices_amount"},{"headerText":"Percentage Amount Released","field":"percentage_amount_released"}]'
      data="[[ $variables.analyticsTableADP ]]"></oj-table>
  </div>

  </div>
  </oj-sp-collection-container>
</oj-sp-smart-search-page>
