<header role="banner" class="oj-sm-flex-initial vb-web-applayout-header oj-sm-only-hide">
  <div class="oj-flex-bar oj-sm-align-items-center vb-web-applayout-header-content" style="height:48px">
    <!-- Navigator toggle button -->
    <div class="oj-flex-bar-start oj-sm-align-items-center">
      <oj-button chroming="borderless" display="icons" on-oj-action="[[$listeners.drawerToggle]]"
        class="oj-button-sm" style="color:#ffffff">
        <span slot="startIcon" class="oj-ux-ico-menu" style="color:#ffffff; font-size:20px"></span>
      </oj-button>
    </div>

    <!-- Application title -->
    <div class="oj-flex-bar-middle oj-sm-align-items-center" style="gap:12px">
      <span style="font-size:18px; font-weight:600; color:#ffffff; letter-spacing:0.5px;">Pay When Paid</span>
    </div>

    <!-- Global toolbar -->
    <div class="oj-flex-bar-end oj-sm-align-items-center">
      <span style="font-size:13px; color:#ffffff; opacity:0.85;">[[ $application.variables.user ]]</span>
    </div>
  </div>
</header>
